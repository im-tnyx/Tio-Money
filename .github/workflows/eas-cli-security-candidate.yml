# Issue #59 / Draft PR #60 — temporary, unprivileged candidate-evidence lane.
# This does NOT dispatch Codespaces, run trusted EAS previews, publish builds,
# install into the repository, or push/merge candidate lockfiles.
name: EAS CLI isolated security candidate (unprivileged)

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/preview-eas-cli/**'
      - 'tests/preview/eas-cli-*.test.mjs'
      - '.github/workflows/eas-cli-security-candidate.yml'

permissions:
  contents: read

concurrency:
  group: eas-unprivileged-candidate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/eas-cli-advisory-gate-59-20261122' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      EXPO_TOKEN: ''
      GITHUB_TOKEN: ''
      NODE_AUTH_TOKEN: ''
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Checkout exact pull request code without persistent Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up reproducible Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Offline candidate and Expo-Go guard tests
        run: |
          set -euo pipefail
          node --test tests/preview/eas-cli-security-inventory.test.mjs tests/preview/eas-cli-remediation-candidate.test.mjs
      - name: Resolve and verify isolated EAS candidate in temp only
        run: |
          set -euo pipefail
          node .github/preview-eas-cli/prepare-candidate.mjs --candidate > "${RUNNER_TEMP}/eas-candidate-output.json"
          cat "${RUNNER_TEMP}/eas-candidate-output.json"
      - name: Emit non-secret verified candidate files for independent review
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { tmpdir } from 'node:os';
          import { resolve, sep } from 'node:path';

          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/eas-candidate-output.json', 'utf8'));
          if (report.status !== 'CANDIDATE_ONLY_NOT_MERGED' ||
              !report.outputDirectory ||
              !resolve(report.outputDirectory).startsWith(resolve(tmpdir()) + sep)) {
            throw new Error('Refusing to publish candidate: missing verified temp-only output');
          }
          for (const name of ['package.json', 'package-lock.json']) {
            const path = resolve(report.outputDirectory, name);
            if (!path.startsWith(resolve(report.outputDirectory) + sep)) {
              throw new Error('Refusing unexpected candidate output location');
            }
            const content = readFileSync(path, 'utf8');
            const sha256 = createHash('sha256').update(content, 'utf8').digest('hex');
            const base64 = Buffer.from(content, 'utf8').toString('base64');
            console.log('CANDIDATE_FILE_START:' + name + ':' + Buffer.byteLength(content, 'utf8') + ':' + sha256);
            for (let index = 0, part = 0; index < base64.length; index += 4000, part++) {
              console.log('CANDIDATE_CHUNK:' + name + ':' + part + ':' + base64.slice(index, index + 4000));
            }
            console.log('CANDIDATE_FILE_END:' + name);
          }
          NODE
