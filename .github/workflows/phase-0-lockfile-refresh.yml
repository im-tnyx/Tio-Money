name: Temporary Phase 0 lockfile refresh

on:
  push:
    branches:
      - feat/phase-0-expo-foundation
    paths:
      - .github/workflows/phase-0-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-0-expo-foundation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(phase-0): regenerate React peer-compatible lockfile"
            git push origin HEAD:refs/heads/feat/phase-0-expo-foundation
          else
            echo "Lockfile already matches package.json."
          fi
