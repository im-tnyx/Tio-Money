name: Gate 2A.3 dispatch probe fixture
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      fixture_pr:
        required: true
        type: string
permissions: {}
jobs:
  marker:
    if: github.repository_id == '1462654174' && github.ref == 'refs/heads/test/gate-2a3-probe-source'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: gate-2a3-publisher-poc-marker
    steps:
      - name: Check for unexpected marker access
        env:
          MARKER: ${{ secrets.GATE_2A3_POC_MARKER }}
        run: |
          if [[ -n "${MARKER:-}" ]]; then
            echo 'Fixture marker unexpectedly accessible'
            exit 1
          fi
          echo 'Fixture marker absent'
