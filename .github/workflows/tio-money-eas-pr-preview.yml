          fi

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve native Draft OTA fingerprints without Expo credentials
        id: draft_runtime
        if: inputs.operation == 'publish_draft_update'
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/draft-eas-update.mjs"
          git show "${GITHUB_SHA}:.github/scripts/draft-eas-update.mjs" > "$helper"
          fingerprints="$(node "$helper" resolve-runtime "$TARGET_PLATFORM")"
          printf 'fingerprints=%s\n' "$fingerprints" >> "$GITHUB_OUTPUT"

      - name: Export Draft OTA bundle without Expo credentials
        if: inputs.operation == 'publish_draft_update'
        env:
          CI: 'true'
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$TARGET_PLATFORM" in
            android|ios) platforms=(--platform "$TARGET_PLATFORM") ;;
            all) platforms=(--platform ios --platform android) ;;
            *) echo "::error::Invalid Draft OTA platform"; exit 1 ;;
          esac
          node_modules/.bin/expo export --output-dir "$RUNNER_TEMP/tio-draft-export" "${platforms[@]}"

      - name: Store the exact Draft OTA export
        if: inputs.operation == 'publish_draft_update'
        id: draft_bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tio-draft-ota-${{ needs.select.outputs.head_sha }}-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/tio-draft-export/metadata.json
            ${{ runner.temp }}/tio-draft-export/_expo/static/js
            ${{ runner.temp }}/tio-draft-export/assets
          if-no-files-found: error
          retention-days: 1

      - name: Validate preview source and dependencies
        run: |
          npm run check
          npx expo install --check

  preview:
    needs: [select, validate]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'publish_update' || inputs.operation == 'publish_draft_update' || inputs.operation == 'build_preview') && github.actor == 'im-tnyx' && github.triggering_actor == 'im-tnyx' && github.run_attempt == '1' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tio-money-eas-preview-trusted

    steps:
      - name: Validate owner-authored PR and immutable source head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VALIDATED_SHA: ${{ needs.select.outputs.head_sha }}
          SELECTED_BASE: ${{ needs.select.outputs.base_sha }}
          TARGET_OPERATION: ${{ inputs.operation }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$TARGET_OPERATION" in
            publish_update|publish_draft_update|build_preview) ;;
            *) echo "::error::Invalid preview operation"; exit 1 ;;
          esac
          case "$TARGET_PLATFORM" in
            android|ios|all) ;;
            *) echo "::error::Invalid OTA platform; expected android, ios, or all"; exit 1 ;;
          esac
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive integer string"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg operation "$TARGET_OPERATION" --arg number "$PR_NUMBER" '
            .state == "open" and (.number | tostring) == $number and
            (if $operation == "publish_draft_update" then .draft == true else .draft == false end) and
            .user.login == "im-tnyx" and
            .head.repo.full_name == $repo and
            .base.repo.full_name == $repo and
            .base.ref == "main" and
            .head.sha != null and .base.sha != null
          ' "$RUNNER_TEMP/pr.json" >/dev/null; then
            if [[ "$(jq -r '.draft' "$RUNNER_TEMP/pr.json")" == "true" ]]; then
              echo "::error title=Draft PR not eligible::Draft PRs qualify only for Draft OTA or Live Expo Go Preview, and must meet that operation's selection rules."
            else
              echo "::error title=Invalid PR selection::EAS requires an open, owner-authored same-repository PR targeting main with the Draft status required by the operation."
            fi
            exit 1
          fi
          selected_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          if [[ "$selected_sha" != "$VALIDATED_SHA" ||
                "$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" != "$SELECTED_BASE" ]]; then
            echo "::error::PR advanced since secretless validation; refusing stale EAS operation"
            exit 1
          fi
          echo "head_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, app identity and source-only preview scope
        env:
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TARGET_OPERATION: ${{ inputs.operation }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            echo "::error::Checked-out source does not equal selected PR head"
            exit 1
          fi
          if [[ ! "$PR_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Selected PR SHA malformed"
            exit 1
          fi
          node -e '
            const c = require("./app.json").expo;
            if (c.owner !== "tnyx-23" || c.slug !== "tio-money" ||
                c.extra?.eas?.projectId !== "722e6857-1159-4414-a024-6a4351e7d3e1" ||
                c.updates?.url !== "https://u.expo.dev/722e6857-1159-4414-a024-6a4351e7d3e1") {
              throw Error("Refusing to publish from a changed Expo project identity");
            }
            if (process.env.TARGET_OPERATION === "publish_draft_update" &&
                (c.runtimeVersion?.policy !== "fingerprint" || c.ios?.runtimeVersion || c.android?.runtimeVersion)) {
              throw Error("Draft OTA requires the approved native fingerprint runtime policy.");
            }
          '
          # Reviewed PRs may also carry tests and Markdown task/documentation
          # records. These paths do not change the Expo runtime or build config.
          # Native/tooling/dependency/signing changes must land in a separately
          # reviewed PR before executing any source with an Expo token here.
          scope="$RUNNER_TEMP/verify-eas-preview-scope.mjs"
          # GITHUB_SHA is the trusted main dispatch revision, separate from the PR checkout.
          git show "${GITHUB_SHA}:.github/scripts/verify-eas-preview-scope.mjs" > "$scope"
          node "$scope" "$PR_BASE_SHA" "$PR_SHA" "$TARGET_OPERATION"
          # A preview build must not prompt CI to invent app identifiers or
          # sign with undeclared credentials. No EXPO_TOKEN is available here.
          if [[ "$TARGET_OPERATION" == "build_preview" ]]; then
            TARGET_PLATFORM="$TARGET_PLATFORM" node <<'NODE'
          const expo = require('./app.json').expo;
          const eas = require('./eas.json');
          const profile = eas.build?.preview;
          const onlyPreview = Object.keys(eas.build || {}).length === 1;
          if (!profile || !onlyPreview ||
              profile.distribution !== 'internal' ||
              profile.channel !== 'pr-preview' ||
              profile.android?.buildType !== 'apk' ||
              !['remote', undefined].includes(profile.credentialsSource) ||
              !['remote', undefined].includes(profile.android?.credentialsSource) ||
              !['remote', undefined].includes(profile.ios?.credentialsSource) ||
              eas.cli?.version !== '27.4.1') {
            throw Error('Refusing non-internal, non-preview or unreviewed EAS build configuration');
          }
          const platform = process.env.TARGET_PLATFORM;
          if (['android', 'all'].includes(platform) &&
              !/^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$/.test(expo.android?.package || '')) {
            throw Error('Missing approved android.package; configure it in a separately reviewed PR before building');
          }
          if (['ios', 'all'].includes(platform) &&
              !/^[A-Za-z][A-Za-z0-9-]*(?:\.[A-Za-z][A-Za-z0-9-]*)+$/.test(expo.ios?.bundleIdentifier || '')) {
            throw Error('Missing approved ios.bundleIdentifier; configure it in a separately reviewed PR before building');
          }
          NODE
          fi

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked project dependencies
        # No dependency lifecycle hook may persist into the EXPO_TOKEN step.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install committed and verify EAS CLI without Expo credentials
        env:
          EAS_CLI_VERSION: "27.4.1"
          EAS_CLI_ROOT: ${{ runner.temp }}/tio-money-verified-eas-cli
        run: |
          set -euo pipefail
          # The reviewed EAS CLI dependency graph is committed outside the app.
          # No npm install / dependency resolution on dispatch; token absent here.
          mkdir -p "$EAS_CLI_ROOT"
          cp .github/preview-eas-cli/package.json "$EAS_CLI_ROOT/package.json"
          cp .github/preview-eas-cli/package-lock.json "$EAS_CLI_ROOT/package-lock.json"
          node - "$EAS_CLI_ROOT/package.json" "$EAS_CLI_ROOT/package-lock.json" "$EAS_CLI_VERSION" <<'NODE'
          const fs = require('node:fs');
          const [manifestFile, lockFile, approved] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
          if (manifest.dependencies?.['eas-cli'] !== approved ||
              lock.packages?.['']?.dependencies?.['eas-cli'] !== approved ||
              lock.packages?.['node_modules/eas-cli']?.version !== approved) {
            throw Error('Committed EAS CLI manifest/lock version mismatch');
          }
          for (const [path, pkg] of Object.entries(lock.packages)) {
            if (!path) continue;
            if (pkg.resolved && (!pkg.resolved.startsWith('https://registry.npmjs.org/') ||
                !pkg.integrity?.startsWith('sha512-'))) {
              throw Error('Untrusted npm registry or sha512 integrity for ' + path);
            }
          }
          NODE
          npm ci --prefix "$EAS_CLI_ROOT" \
            --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          ( cd "$EAS_CLI_ROOT" && npm audit signatures --registry=https://registry.npmjs.org )
          node - "$EAS_CLI_ROOT/node_modules/eas-cli/package.json" "$EAS_CLI_VERSION" <<'NODE'
          const [file, approved] = process.argv.slice(2);
          if (require(file).version !== approved) throw Error('Installed EAS CLI version mismatch');
          NODE
          "$EAS_CLI_ROOT/node_modules/.bin/eas" --version

      - name: Require the exact Draft OTA artifact identifier
        if: inputs.operation == 'publish_draft_update'
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.draft_artifact_id }}
        run: |
          if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Validated Draft OTA artifact ID is missing or invalid."
            exit 1
          fi

      - name: Download the validated Draft OTA export from this run
        if: inputs.operation == 'publish_draft_update'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.draft_artifact_id }}
          path: ${{ runner.temp }}/tio-draft-export
          merge-multiple: true

      - name: Verify Draft OTA export metadata and file containment
        if: inputs.operation == 'publish_draft_update'
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          DRAFT_RUNTIME_FINGERPRINTS: ${{ needs.validate.outputs.draft_runtime_fingerprints }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/draft-eas-update.mjs"
          git show "${GITHUB_SHA}:.github/scripts/draft-eas-update.mjs" > "$helper"
          node "$helper" bundle "$RUNNER_TEMP/tio-draft-export" "$TARGET_PLATFORM"
          node "$helper" verify-runtime "$TARGET_PLATFORM"

      - name: Revalidate immutable PR and source scope before EAS
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TARGET_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          worktree="$(git status --porcelain=v1 --untracked-files=normal)"
          test -z "$worktree"
          node "$RUNNER_TEMP/verify-eas-preview-scope.mjs" "$PR_BASE_SHA" "$PR_SHA" "$TARGET_OPERATION"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$PR_SHA" --arg base "$PR_BASE_SHA" --arg operation "$TARGET_OPERATION" '
              .state == "open" and .user.login == "im-tnyx" and
              (if $operation == "publish_draft_update" then .draft == true else .draft == false end) and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              .base.ref == "main" and .head.sha == $head and .base.sha == $base
            ' >/dev/null

      - name: Publish OTA or queue internal preview build (owner dispatch only)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          TARGET_OPERATION: ${{ inputs.operation }}
          TARGET_PLATFORM: ${{ inputs.platform }}
          DRAFT_RUNTIME_FINGERPRINTS: ${{ needs.validate.outputs.draft_runtime_fingerprints }}
        run: |
          set -euo pipefail
          case "$TARGET_OPERATION" in
            publish_update|publish_draft_update|build_preview) ;;
            *) echo "::error::Invalid preview operation"; exit 1 ;;
          esac
          case "$TARGET_PLATFORM" in
            android|ios|all) ;;
            *) echo "::error::Invalid preview platform"; exit 1 ;;
          esac
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing environment-scoped EXPO_TOKEN; owner must configure it securely"
            exit 1
          fi
          eas="$RUNNER_TEMP/tio-money-verified-eas-cli/node_modules/.bin/eas"
          if [[ "$TARGET_OPERATION" == "publish_draft_update" ]]; then
            helper="$RUNNER_TEMP/draft-eas-update.mjs"
            branch="$(env -u EXPO_TOKEN node "$helper" branch "$PR_NUMBER")"
            env -u GH_TOKEN node "$helper" isolation "$eas" "$branch" before
            # Check the Draft state and immutable pair again after the Expo reads.
            # The GitHub and Expo services cannot make this check and publish atomic.
            test "$(git rev-parse HEAD)" = "$PR_SHA"
            test -z "$(git status --porcelain=v1 --untracked-files=normal)"
            env -u EXPO_TOKEN gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
              env -u EXPO_TOKEN node "$helper" selection "$PR_NUMBER" "$GITHUB_REPOSITORY" "$PR_SHA" "$PR_BASE_SHA"
            output="$RUNNER_TEMP/tio-draft-update-result.json"
            publish_status=0
            env -u GH_TOKEN "$eas" update \
              --branch "$branch" \
              --message "Tio Money Draft PR #${PR_NUMBER} (${PR_SHA})" \
              --environment preview --platform "$TARGET_PLATFORM" \
              --skip-bundler --input-dir "$RUNNER_TEMP/tio-draft-export" \
              --json --non-interactive > "$output" 2> "$RUNNER_TEMP/tio-draft-update-errors.log" || publish_status=$?
            # Read the isolation state even when the CLI fails after a possible server-side write.
            post_status=0
            if ! env -u GH_TOKEN node "$helper" isolation "$eas" "$branch" after; then
              echo "::error title=Draft OTA isolation::Post-publication isolation could not be confirmed. Inspect the named branch and channel mappings in Expo before retrying or sharing."
              printf '%s\n' 'Post-publication isolation failed. Inspect the branch and channel mappings in Expo.' >> "$GITHUB_STEP_SUMMARY"
              post_status=1
            fi
            if (( publish_status != 0 )); then
              echo "::error::Draft OTA publication did not return success. Check the isolated EAS branch before retrying."
              exit 1
            fi
            if ! env -u EXPO_TOKEN -u GH_TOKEN node "$helper" summary "$output" "$PR_NUMBER" "$PR_SHA" "$TARGET_PLATFORM" >> "$GITHUB_STEP_SUMMARY"; then
              echo "::error::Draft OTA result verification failed after publication. Inspect the isolated branch and runtime diagnostics before retrying."
              post_status=1
            fi
            if ! env -u EXPO_TOKEN gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
              env -u EXPO_TOKEN node "$helper" selection "$PR_NUMBER" "$GITHUB_REPOSITORY" "$PR_SHA" "$PR_BASE_SHA"; then
              echo "::error::Draft eligibility could not be confirmed after publication. Inspect the run diagnostics and any update metadata in the summary."
              post_status=1
            fi
            exit "$post_status"
          elif [[ "$TARGET_OPERATION" == "publish_update" ]]; then
            env -u GH_TOKEN "$eas" update \
              --branch pr-preview \
              --message "Tio Money manual preview PR #${PR_NUMBER} (${PR_SHA:0:7})" \
              --environment preview \
              --platform "$TARGET_PLATFORM" \
              --non-interactive
          else
            # Remote EAS signing must already be configured; never prompt,
            # initialize a new EAS project, auto-submit or create production builds.
            env -u GH_TOKEN "$eas" build \
              --profile preview \
              --platform "$TARGET_PLATFORM" \
              --non-interactive \
              --no-wait
          fi
