name: Tio Money manual EAS PR preview

# This workflow can only be invoked manually after being reviewed and merged
# into the trusted default branch. Never add Expo secrets to untrusted PR CI.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open owner-authored PR targeting main (JS-only change)
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tio-money-eas-pr-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.actor == 'im-tnyx' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tio-money-eas-preview-trusted

    steps:
      - name: Validate owner-authored PR and immutable source head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number is not numeric"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and
            .draft == false and
            .user.login == "im-tnyx" and
            .head.repo.full_name == $repo and
            .base.repo.full_name == $repo and
            .base.ref == "main" and
            .head.sha != null and .base.sha != null
          ' "$RUNNER_TEMP/pr.json" >/dev/null
          echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, app identity and JS-only OTA scope
        env:
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$PR_SHA" ]]; then
            echo "::error::Checked-out source does not equal selected PR head"
            exit 1
          fi
          if [[ ! "$PR_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Selected PR SHA malformed"
            exit 1
          fi
          node -e '
            const c = require("./app.json").expo;
            if (c.owner !== "tnyx-23" || c.slug !== "tio-money" ||
                c.extra?.eas?.projectId !== "722e6857-1159-4414-a024-6a4351e7d3e1" ||
                c.updates?.url !== "https://u.expo.dev/722e6857-1159-4414-a024-6a4351e7d3e1") {
              throw Error("Refusing to publish from a changed Expo project identity");
            }
          '
          native_change=0
          while IFS= read -r -d '' path; do
            case "$path" in
              app.json|app.config.*|eas.json|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|bun.lock*|expo-module.config.json|android/*|ios/*|plugins/*|modules/*|native/*)
                echo "::error::Native/runtime affecting change $path. A new reviewed preview build is required."
                native_change=1
                ;;
            esac
          done < <(git diff --name-only -z "$PR_BASE_SHA...$PR_SHA")
          if [[ "$native_change" -ne 0 ]]; then exit 1; fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate preview source and dependencies
        run: |
          npm run check
          npx expo install --check

      - name: Install pinned and verify EAS CLI before Expo token is available
        env:
          EAS_CLI_VERSION: "27.4.1"
          EAS_CLI_ROOT: ${{ runner.temp }}/tio-money-verified-eas-cli
        run: |
          set -euo pipefail
          # Expo discourages EAS CLI inside the mobile app dependency tree.
          # Isolate its npm dependencies from the SDK 58 app and Expo token.
          mkdir -p "$EAS_CLI_ROOT"
          node - "$EAS_CLI_ROOT/package.json" "$EAS_CLI_VERSION" <<'NODE'
          const fs = require('node:fs');
          const [file, version] = process.argv.slice(2);
          fs.writeFileSync(file, JSON.stringify({
            name: 'tio-money-verified-eas-cli',
            private: true,
            version: '0.0.0',
            dependencies: { 'eas-cli': version }
          }, null, 2) + '\n');
          NODE
          npm install --prefix "$EAS_CLI_ROOT" --package-lock-only \
            --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          # npm ci verifies tarball integrity against this isolated lockfile.
          npm ci --prefix "$EAS_CLI_ROOT" \
            --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          # Fail closed if npm cannot validate available registry signatures.
          ( cd "$EAS_CLI_ROOT" && npm audit signatures --registry=https://registry.npmjs.org )
          node - "$EAS_CLI_ROOT/package-lock.json" "$EAS_CLI_VERSION" <<'NODE'
          const fs = require('node:fs');
          const [file, expected] = process.argv.slice(2);
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (lock.packages?.['']?.dependencies?.['eas-cli'] !== expected ||
              lock.packages?.['node_modules/eas-cli']?.version !== expected) {
            throw Error('EAS CLI isolated lockfile version mismatch');
          }
          for (const [path, pkg] of Object.entries(lock.packages)) {
            if (path && pkg.resolved?.startsWith('https://registry.npmjs.org/') &&
                !pkg.integrity?.startsWith('sha512-')) {
              throw Error('Missing sha512 npm package integrity for ' + path);
            }
          }
          NODE
          node - "$EAS_CLI_ROOT/node_modules/eas-cli/package.json" "$EAS_CLI_VERSION" <<'NODE'
          const [file, expected] = process.argv.slice(2);
          if (require(file).version !== expected) throw Error('Installed EAS CLI version mismatch');
          NODE
          "$EAS_CLI_ROOT/node_modules/.bin/eas" --version

      - name: Publish non-production PR preview OTA (explicit owner dispatch only)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing environment-scoped EXPO_TOKEN; owner must configure it securely"
            exit 1
          fi
          "$RUNNER_TEMP/tio-money-verified-eas-cli/node_modules/.bin/eas" update \
            --branch pr-preview \
            --message "Tio Money manual preview PR #${PR_NUMBER} (${PR_SHA:0:7})" \
            --environment preview \
            --non-interactive
