name: TIO MONEY EXPO PR REVIEW

# Manual operations are owner-dispatched from trusted main. The unprivileged
# push signal can invoke only the Codespaces job.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Owner PR number (EAS requires non-Draft; Codespaces allows Draft)
        required: true
        type: string
      operation:
        description: Live Expo Go, OTA update or internal preview build
        required: true
        default: codespaces_live
        type: choice
        options:
          - codespaces_live
          - publish_update
          - build_preview
      platform:
        description: Android, iOS or both (build requires signing and app identifiers)
        required: true
        default: all
        type: choice
        options:
          - android
          - ios
          - all

  workflow_run:
    workflows:
      - Tio Money preview push signal
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ (github.event_name == 'workflow_run' || inputs.operation == 'codespaces_live') && 'tio-money-codespaces-pr-preview' || 'tio-money-eas-pr-preview' }}
  cancel-in-progress: false

jobs:
  codespaces_live:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.operation == 'codespaces_live' &&
         github.actor == 'im-tnyx' &&
         github.triggering_actor == 'im-tnyx') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == 'im-tnyx/Tio-Money' &&
         github.event.workflow_run.actor.login == 'im-tnyx' &&
         github.event.workflow_run.head_branch != 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tio-money-codespaces-trusted
    steps:
      - name: Resolve exactly one owner-selected immutable PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          PUSH_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          selected=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$INPUT_PLATFORM" in
              android|ios|all) ;;
              *) echo "::error::Invalid Expo Go platform selection."; exit 1 ;;
            esac
            if [[ ! "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::PR number must be positive."
              exit 1
            fi
            selected="$INPUT_PR"
          else
            if [[ ! "$PUSH_SHA" =~ ^[0-9a-f]{40}$ || -z "$PUSH_BRANCH" ]]; then
              echo "::error::Untrusted or malformed push metadata."
              exit 1
            fi
            mapfile -t matches < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${PUSH_SHA}/pulls?per_page=100" \
                --jq '.[] | select(.state == "open") | .number'
            )
            if [[ "${#matches[@]}" -eq 0 ]]; then
              echo "No open PR for this owner push; no preview change."
              exit 0
            fi
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Ambiguous PRs for immutable push SHA; refusing preview."
              exit 1
            fi
            selected="${matches[0]}"
          fi

          # This request retains the existing READ-ONLY GITHUB_TOKEN; on denial,
          # emit only GitHub's documented non-secret permission diagnostic headers.
          # Never print a credential, request Authorization header or API body.
          pr_headers="$RUNNER_TEMP/preview-pr-api-headers.txt"
          # Keep the bearer token out of curl process argv and disk files.
          # Pass the Authorization header through an ephemeral stdin curl config.
          pr_status="$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
            curl --config - --silent --show-error --max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --dump-header "$pr_headers" \
              --output "$RUNNER_TEMP/preview-pr.json" \
              --write-out '%{http_code}' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${selected}")"
          if [[ "$pr_status" != "200" ]]; then
            echo "::error::Selected PR read returned HTTP ${pr_status}; Codespace activation denied."
            # Values are explicitly character-filtered and length-bounded to
            # avoid log control-sequence injection by untrusted API responses.
            awk -F ':' '
              {
                name = tolower($1)
                if (name != "x-accepted-github-permissions" &&
                    name != "x-github-request-id" &&
                    name != "x-github-api-version-selected") next
                value = substr($0, index($0, ":") + 1)
                gsub(/[^[:alnum:]._,;= -]/, "?", value)
                print "GitHub API diagnostic " name ":" substr(value, 1, 240)
              }
            ' "$pr_headers"
            exit 1
          fi
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .number > 0 and
            .changed_files > 0 and .changed_files <= 100 and
            .user.login == "im-tnyx" and
            .head.repo.full_name == $repo and
            .base.repo.full_name == $repo and
            .base.ref == "main" and
            .head.ref != "main" and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            (.base.sha | test("^[0-9a-f]{40}$")) and
            any(.labels[]?; .name == "tio-preview")
          ' "$RUNNER_TEMP/preview-pr.json" >/dev/null || {
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "Push does not target a labeled owner-authored main-bound PR; skipping."
              exit 0
            fi
            echo "::error::Only an open owner-authored main-bound PR with the tio-preview label may be selected."
            exit 1
          }

          pr_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/preview-pr.json")"
          base_sha="$(jq -r '.base.sha' "$RUNNER_TEMP/preview-pr.json")"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$PUSH_SHA" != "$pr_sha" ||
                  "$PUSH_BRANCH" != "$(jq -r '.head.ref' "$RUNNER_TEMP/preview-pr.json")" ]]; then
              echo "::error::PR moved after push or branch mismatch; refusing stale code."
              exit 1
            fi
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=tio-preview&per_page=100" \
            --jq '.[] | select(.pull_request != null) | .number' > "$RUNNER_TEMP/active-preview-prs.txt"
          mapfile -t active < "$RUNNER_TEMP/active-preview-prs.txt"
          if [[ "${#active[@]}" -ne 1 || "${active[0]:-}" != "$selected" ]]; then
            echo "::error::Exactly one open PR may carry tio-preview. Remove the label from other PRs."
            exit 1
          fi

          printf 'selected=true\npr_number=%s\nhead_sha=%s\nbase_sha=%s\n' \
            "$selected" "$pr_sha" "$base_sha" >> "$GITHUB_OUTPUT"
          echo "Approved exact preview source: PR #$selected at $pr_sha"

      - name: Checkout trusted main-branch validation and sync scripts
        if: steps.pr.outputs.selected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restrict exact captured PR revision to source-only UI changes
        id: scope
        if: steps.pr.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ steps.pr.outputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          count=0
          rejected=0
          # A moving /pulls/{number}/files endpoint cannot attest the SHA
          # chosen earlier. Fetch the diff from the immutable base/head pair.
          gh api "repos/${GITHUB_REPOSITORY}/compare/${PR_BASE_SHA}...${PR_SHA}?per_page=100" \
            > "$RUNNER_TEMP/immutable-pr-compare.json"
          # A pushed revision or changed PR state after capture must fail.
          bash .github/scripts/recheck-codespaces-preview.sh
          merge_base="$(jq -er '.merge_base_commit.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/immutable-pr-compare.json")"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Prepare exact immutable PR source bundle
        if: steps.pr.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Repository contents are read with the scoped Actions token, never
          # with the Codespaces credential and never in a remote Codespace.
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid immutable preview SHA."
            exit 1
          fi
          gh auth setup-git
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin "$TARGET_SHA"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$TARGET_SHA"
          git update-ref refs/tio-preview/selected "$TARGET_SHA"
          bundle="$RUNNER_TEMP/tio-money-preview.bundle"
          git bundle create "$bundle" refs/tio-preview/selected
          git bundle verify "$bundle"
          bundle_bytes="$(stat -c '%s' -- "$bundle")"
          if (( bundle_bytes < 1 || bundle_bytes > 134217728 )); then
            rm -f -- "$bundle"
            echo "::error::Immutable preview bundle exceeds the 128 MiB transfer limit."
            exit 1
          fi
      - name: Prepare trusted Metro programs for SSH streaming
        if: steps.pr.outputs.selected == 'true'
        run: |
          set -euo pipefail
          ownership="$(base64 -w0 .github/scripts/preflight-pr-codespaces-preview.mjs)"
          sed "s|../.github/scripts/preflight-pr-codespaces-preview.mjs|data:text/javascript;base64,$ownership|" \
            scripts/start-codespace-expo.mjs > "$RUNNER_TEMP/trusted-metro-starter.mjs"
          sed "s|\./preflight-pr-codespaces-preview.mjs|data:text/javascript;base64,$ownership|" \
            .github/scripts/verify-codespace-served-source.mjs > "$RUNNER_TEMP/trusted-metro-source-probe.mjs"
          {
            printf "%s\n" 'run_trusted_metro_sync() {' \
              "  node --input-type=module - --sync-selected \"\$1\" \"\$2\" \"\$3\" <<'TRUSTED_METRO_STARTER'"
            cat "$RUNNER_TEMP/trusted-metro-starter.mjs"
            printf "%s\n" 'TRUSTED_METRO_STARTER' '}'
            cat .github/scripts/sync-pr-codespaces-preview.sh
          } > "$RUNNER_TEMP/trusted-metro-sync.sh"

      - name: Discover and start only the verified preview-only Codespace
        id: codespace
        if: steps.pr.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          PREFERRED_CODESPACE: ${{ vars.TIO_MONEY_PREVIEW_CODESPACE }}
          PREFERRED_CODESPACE_ID: ${{ vars.TIO_MONEY_PREVIEW_CODESPACE_ID }}
          PR_READ_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TARGET_PR: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing CODESPACES_TOKEN in the main-restricted environment."
            exit 1
          fi
          if [[ -z "$PREFERRED_CODESPACE" ]]; then
            echo "::error::Configure TIO_MONEY_PREVIEW_CODESPACE to the name of a separate preview-only Codespace."
            exit 1
          fi
          if [[ ! "$PREFERRED_CODESPACE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ || ${#PREFERRED_CODESPACE} -gt 128 ]]; then
            echo "::error::Invalid preview Codespace name; refusing to query or start it."
            exit 1
          fi
          # Owner identified this as their editing Codespace. Never wake/sync it.
          if [[ "$PREFERRED_CODESPACE" == "automatic-orbit-jjxwq55wqr5gcj7gj" ]]; then
            echo "::error::Editing Codespace is explicitly disallowed for automated preview."
            exit 1
          fi
          if [[ ! "$PREFERRED_CODESPACE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure TIO_MONEY_PREVIEW_CODESPACE_ID to the dedicated Codespace's immutable GitHub numeric ID."
            exit 1
          fi
          selected_json="$RUNNER_TEMP/dedicated-preview-codespace.json"
          gh api "/user/codespaces/${PREFERRED_CODESPACE}" > "$selected_json"
          # Read-only identity gate: exact name + immutable ID + preview-only
          # display name + owner/repository. No wake or remote mutation before it.
          node .github/scripts/verify-pr-preview-codespace.mjs \
            "$selected_json" "$PREFERRED_CODESPACE" "$PREFERRED_CODESPACE_ID"
          codespace="$PREFERRED_CODESPACE"
          state="$(jq -r '.state // empty' "$selected_json")"
          if [[ "$state" != "Available" ]]; then
            env -u PR_READ_TOKEN GH_TOKEN="$PR_READ_TOKEN" bash .github/scripts/recheck-codespaces-preview.sh
            # GitHub Codespaces can transition to running after the initial GET
            # but before POST /start. Only the exact known already-running 409
            # is idempotent; every other API failure still aborts this job.
            start_failure=""
            if start_failure="$(gh api --method POST "/user/codespaces/${codespace}/start" 2>&1 >/dev/null)"; then
              :
            elif [[ "$start_failure" == "gh: The codespace is already running (HTTP 409)" ]]; then
              echo "Codespace start raced with another transition; rechecking verified availability."
            else
              echo "::error::Dedicated Codespace start API failed; refusing to bypass an unexpected failure."
              exit 1
            fi
          fi
          for attempt in $(seq 1 120); do
            gh api "/user/codespaces/${codespace}" > "$selected_json"
            # Re-check identity after waking and immediately before SSH.
            node .github/scripts/verify-pr-preview-codespace.mjs \
              "$selected_json" "$PREFERRED_CODESPACE" "$PREFERRED_CODESPACE_ID" >/dev/null
            state="$(jq -r '.state // empty' "$selected_json")"
            if [[ "$state" == "Available" ]]; then
              printf 'name=%s\n' "$codespace" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$state" == "Deleted" ]]; then
              echo "::error::Codespace was deleted."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Dedicated preview Codespace not available after 10 minutes."
          exit 1
      - name: Reuse an already healthy exact-SHA preview
        id: existing
        if: steps.pr.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
          TARGET_SHA: ${{ steps.pr.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_READ_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TARGET_PR: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Main-owned read-only gate also supports older approved PRs whose
          # starter predates --preflight. It never executes PR code here.
          env -u PR_READ_TOKEN GH_TOKEN="$PR_READ_TOKEN" bash .github/scripts/recheck-codespaces-preview.sh
          mode=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then mode="--manual"; fi
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            node --input-type=module - "$mode" \
            < .github/scripts/preflight-pr-codespaces-preview.mjs
          result="$(gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            bash -s -- "$TARGET_SHA" < .github/scripts/check-pr-codespaces-preview.sh)"
          case "$result" in
            *EXACT_SHA)
              if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                echo 'no_op=false' >> "$GITHUB_OUTPUT"
              elif gh codespace ssh --codespace "$CODESPACE_NAME" -- \
                node --input-type=module - --status < "$RUNNER_TEMP/trusted-metro-starter.mjs"; then
                echo 'no_op=true' >> "$GITHUB_OUTPUT"
              else
                echo 'no_op=false' >> "$GITHUB_OUTPUT"
              fi
              ;;
            *REFRESH_REQUIRED) echo 'no_op=false' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Unexpected Codespace probe result.'; exit 1 ;;
          esac

      - name: Sync exact PR source and bring up Expo Go tunnel
        if: steps.pr.outputs.selected == 'true' && steps.existing.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
          TARGET_SHA: ${{ steps.pr.outputs.head_sha }}
          TARGET_PR: ${{ steps.pr.outputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_READ_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          # The Codespaces credential only establishes SSH, never fetches Git
          # objects and is never forwarded into the remote environment.
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ || ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid immutable SHA or run identifier."
            exit 1
          fi
          bundle="$RUNNER_TEMP/tio-money-preview.bundle"
          test -s "$bundle"
          remote_dir="/tmp/tio-money-preview-${TARGET_SHA}-${GITHUB_RUN_ID}"
          remote_bundle="${remote_dir}/source.bundle"
          bundle_sha256="$(sha256sum -- "$bundle" | cut -d ' ' -f 1)"
          env -u PR_READ_TOKEN GH_TOKEN="$PR_READ_TOKEN" bash .github/scripts/recheck-codespaces-preview.sh
          # Use a fresh private directory so SCP cannot follow an attacker-owned
          # pre-existing destination, and keep credentials on the trusted runner.
          printf -v remote_prepare_command \
            'set -eu; umask 077; mkdir -m 700 -- %q' "$remote_dir"
          gh codespace ssh --codespace "$CODESPACE_NAME" -- "$remote_prepare_command"
          # The cleanup only targets the directory created above. It is also
          # attempted when a copy or subsequent validation fails.
          cleanup_remote_bundle() {
            local cleanup
            printf -v cleanup \
              'set -eu; if [ -d %q ] && [ ! -L %q ] && [ "$(stat -c %%u -- %q)" = "$(id -u)" ]; then rm -f -- %q; rmdir -- %q; fi' \
              "$remote_dir" "$remote_dir" "$remote_dir" "$remote_bundle" "$remote_dir"
            gh codespace ssh --codespace "$CODESPACE_NAME" -- "$cleanup" >/dev/null 2>&1 || true
          }
          trap cleanup_remote_bundle EXIT
          # Official Codespaces file-copy transport, rather than piping bundle
          # bytes through a remote-shell command's stdin.
          # GitHub CLI's default SCP literal path quoting can become part of
          # the destination filename with SFTP (observed run #92). --expand
          # avoids literal quote wrapping. This is safe ONLY for the fixed
          # path built from the validated hex TARGET_SHA and numeric RUN_ID.
          gh codespace cp --expand -c "$CODESPACE_NAME" "$bundle" "remote:$remote_bundle"
          rm -f -- "$bundle"
          # SCP can preserve the source mode; enforce the exact remote mode
          # only after verifying a regular, non-symlink user-owned file.
          printf -v remote_finalize_command \
            'set -eu; test -f %q; test ! -L %q; test "$(stat -c %%u -- %q)" = "$(id -u)"; chmod 600 -- %q' \
            "$remote_bundle" "$remote_bundle" "$remote_bundle" "$remote_bundle"
          gh codespace ssh --codespace "$CODESPACE_NAME" -- "$remote_finalize_command"
          # Recheck immediately before the worktree mutation. The remote sync
          # script stays on trusted main and independently checks the worktree.
          mode=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then mode="--manual"; fi
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            node --input-type=module - "$mode" \
            < .github/scripts/preflight-pr-codespaces-preview.mjs
          env -u PR_READ_TOKEN GH_TOKEN="$PR_READ_TOKEN" bash .github/scripts/recheck-codespaces-preview.sh
          # Trusted main script verifies private-dir ownership, file size,
          # permissions, SHA-256, Git bundle and exact selected PR commit.
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            bash -s -- "$TARGET_SHA" "$TARGET_PR" "$remote_bundle" "$bundle_sha256" "$mode" \
            < "$RUNNER_TEMP/trusted-metro-sync.sh"

      - name: Verify served Metro source and healthy tunnel
        if: steps.pr.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
          TARGET_SHA: ${{ steps.pr.outputs.head_sha }}
          TARGET_PLATFORM: ${{ inputs.platform }}
          EVENT_NAME: ${{ github.event_name }}
          PR_READ_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TARGET_PR: ${{ steps.pr.outputs.pr_number }}
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then TARGET_PLATFORM=all; fi
          case "$TARGET_PLATFORM" in android|ios|all) ;; *) exit 1 ;; esac
          env -u PR_READ_TOKEN GH_TOKEN="$PR_READ_TOKEN" bash .github/scripts/recheck-codespaces-preview.sh
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            node --input-type=module - --status < "$RUNNER_TEMP/trusted-metro-starter.mjs"
          # The probe is from trusted main and is streamed over SSH. No PR
          # script is executed on this privileged Actions runner.
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            node --input-type=module - -- "$TARGET_SHA" "$TARGET_PLATFORM" "$MERGE_BASE" \
            < "$RUNNER_TEMP/trusted-metro-source-probe.mjs"

  select:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'publish_update' || inputs.operation == 'build_preview') && github.actor == 'im-tnyx' && github.triggering_actor == 'im-tnyx' && github.run_attempt == '1' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
      - name: Validate owner-authored PR and immutable source head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_OPERATION: ${{ inputs.operation }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$TARGET_OPERATION" in
            publish_update|build_preview) ;;
            *) echo "::error::Invalid preview operation"; exit 1 ;;
          esac
          case "$TARGET_PLATFORM" in
            android|ios|all) ;;
            *) echo "::error::Invalid OTA platform; expected android, ios, or all"; exit 1 ;;
          esac
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR number must be a positive integer string"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and
            .draft == false and
            .user.login == "im-tnyx" and
            .head.repo.full_name == $repo and
            .base.repo.full_name == $repo and
            .base.ref == "main" and
            .head.sha != null and .base.sha != null
          ' "$RUNNER_TEMP/pr.json" >/dev/null; then
            if [[ "$(jq -r '.draft' "$RUNNER_TEMP/pr.json")" == "true" ]]; then
              echo "::error title=Draft PR not eligible::PR #${PR_NUMBER} is still Draft. EAS OTA/build requires a reviewed non-Draft PR. Use the trusted Codespaces preview for draft UI review."
            else
              echo "::error title=Invalid PR selection::EAS requires an open, non-Draft, owner-authored same-repository PR targeting main."
            fi
            exit 1
          fi
          selected_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          if [[ ! "$selected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Selected PR SHA malformed"
            exit 1
          fi
          if [[ ! "$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Selected base SHA malformed"
