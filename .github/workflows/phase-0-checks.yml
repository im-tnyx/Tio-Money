name: Phase 0 checks

on:
  pull_request:
  push:
    branches:
      - feat/phase-0-expo-foundation

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Strict TypeScript, ESLint, format and unit tests
        run: npm run check
      - name: Validate Expo public configuration
        run: npx expo config --type public > /dev/null
      - name: Bundle Expo Router for Android and iOS (Metro smoke)
        run: |
          CI=1 npx expo export --platform android --output-dir dist/phase0-android
          CI=1 npx expo export --platform ios --output-dir dist/phase0-ios
      - name: Check default build for SMS permissions
        run: |
          if grep -R -E 'READ_SMS|RECEIVE_SMS|READ_CALL_LOG' app.json src/; then
            echo "Unexpected restricted permission reference in default app configuration"
            exit 1
          fi
