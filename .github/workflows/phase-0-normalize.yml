name: One-time Phase 0 dependency normalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/phase-0-expo-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-0-expo-foundation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve matching React peer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply consistent formatting
        run: npx prettier --write "src/**/*.{ts,tsx}" "tests/**/*.ts" "app.json" "package.json" "tsconfig.json" "eslint.config.js" ".prettierrc.json"
      - name: Commit deterministic lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json src tests app.json tsconfig.json eslint.config.js .prettierrc.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(phase-0): synchronize React peer lockfile"
            git push origin HEAD:refs/heads/feat/phase-0-expo-foundation
          fi
