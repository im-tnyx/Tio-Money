name: One-time Phase 0 normalization

on:
  push:
    branches:
      - feat/phase-0-expo-foundation
    paths:
      - .github/workflows/phase-0-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/feat/phase-0-expo-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-0-expo-foundation
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve dependency lockfile (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply Prettier only to Phase 0 code and configs
        run: |
          npx prettier --write "src/**/*.{ts,tsx}" "tests/**/*.ts" "app.json" "package.json" "tsconfig.json" "eslint.config.js" ".prettierrc.json"
      - name: Confirm formatted source
        run: npx prettier --check "src/**/*.{ts,tsx}" "tests/**/*.ts" "app.json" "package.json" "tsconfig.json" "eslint.config.js" ".prettierrc.json"
      - name: Commit lockfile and formatted scaffold on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json app.json tsconfig.json eslint.config.js .prettierrc.json src tests
          if git diff --cached --quiet; then
            echo "No normalization changes"
          else
            git commit -m "chore(phase-0): lock Expo dependencies and format source"
            git push origin HEAD:refs/heads/feat/phase-0-expo-foundation
          fi
