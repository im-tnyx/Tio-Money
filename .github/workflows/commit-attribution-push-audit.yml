name: Commit attribution push audit

# One independent audit for each supported branch push, plus non-main PR
# detection. No App key, schedule, enrollment or previous-run dependency.
on:
  push:
    branches: ['**']
  pull_request:
    branches-ignore: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  audit:
    name: Branch attribution audit
    if: >-
      vars.GUARD_CONSUMER_AUDIT_ENABLED == 'true' &&
      github.repository == 'im-tnyx/Tio-Money' && github.repository_id == '1462654174'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Fetch immutable central checker
        env:
          CHECKER_SHA: ${{ vars.GUARD_CHECKER_SHA }}
        run: |
          set -euo pipefail
          test "$CHECKER_SHA" = 5e0ff0a56b4f5f503419a12c20930bef0df22bc7
          git -c core.hooksPath=/dev/null init --quiet checker
          git -C checker remote add origin https://github.com/im-tnyx/im-tnyx.git
          git -C checker -c core.hooksPath=/dev/null fetch --quiet --no-tags origin refs/heads/main
          git -C checker merge-base --is-ancestor "$CHECKER_SHA" FETCH_HEAD
          git -C checker -c core.hooksPath=/dev/null checkout --quiet --detach "$CHECKER_SHA"
          test "$(git -C checker rev-parse HEAD)" = "$CHECKER_SHA"
          python -m pip install --require-hashes --only-binary=:all: -r checker/requirements-shadow.txt
      - name: Verify exact push or PR
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_SHA: ${{ vars.GUARD_CHECKER_SHA }}
          POLICY_EPOCH: ${{ vars.GUARD_POLICY_EPOCH }}
          POLICY_FILE: checker/config/pilots/tio-money.json
          PYTHONPATH: checker
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python -B trusted/scripts/security/attribution_local.py push
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python -B trusted/scripts/security/attribution_local.py pr
          else
            exit 1
          fi
